services:
  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: enterprise-search-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "OPENSEARCH_INITIAL_ADMIN_PASSWORD=DevLocalPass123!"
    ports:
      - "9200:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: enterprise-search-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  opensearch-data:
  qdrant-data: